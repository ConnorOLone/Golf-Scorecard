<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scorecard">
<meta name="theme-color" content="#0f6e56">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Scorecard</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, summary, .hole, .score, .stepper button { touch-action: manipulation; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: #f5f5f7;
    color: #1c1c1e;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 12px 16px 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 12px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .header-meta {
    font-size: 13px;
    color: #8e8e93;
    text-align: right;
    line-height: 1.3;
  }
  .header-meta .course-name {
    color: #1c1c1e;
    font-weight: 500;
  }
  .date-btn {
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    font-size: 13px;
    padding: 2px 0;
    cursor: pointer;
    text-align: right;
    -webkit-appearance: none;
    appearance: none;
  }
  #dateInput {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  .new-round-btn {
    background: transparent;
    border: 2px solid rgba(0, 0, 0, 0.15);
    color: #0f6e56;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    margin: 0 8px;
    vertical-align: middle;
  }
  .new-round-btn:hover,
  .new-round-btn:active {
    border-color: rgba(0, 0, 0, 0.3);
    background: rgba(0, 0, 0, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    .new-round-btn {
      border-color: rgba(255, 255, 255, 0.5);
      color: white;
    }
    .new-round-btn:hover,
    .new-round-btn:active {
      border-color: white;
      background: rgba(255, 255, 255, 0.1);
    }
  }
  .summary {
    background: #0f6e56;
    color: white;
    border-radius: 16px;
    padding: 20px 16px 16px;
    margin-bottom: 16px;
    text-align: center;
    position: relative;
  }
  .summary-hero { line-height: 1; }
  .summary-hero-value {
    font-size: 52px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
  }
  .summary-hero-value.danger { color: #ffb4a8; }
  .summary-hero-value.info { color: #a8e6cf; }
  .summary-hero-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.75;
    margin-top: 6px;
  }
  .summary-sub {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 14px;
    font-size: 13px;
  }
  .summary-sub span { opacity: 0.85; }
  .summary-sub b { font-weight: 600; opacity: 1; }
  .splits {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 0.5px solid rgba(255,255,255,0.18);
    font-size: 12px;
    opacity: 0.9;
  }
  .splits span { white-space: nowrap; }
  .splits b { font-weight: 600; }
  .splits .diff { opacity: 0.7; margin-left: 4px; }

  details.panel {
    background: white;
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 12px;
    border: 0.5px solid rgba(0,0,0,0.1);
  }
  details.panel > summary {
    font-size: 13px;
    color: #6b6b70;
    cursor: pointer;
    padding: 4px 0;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::after {
    content: "›";
    transition: transform 0.2s;
    color: #c7c7cc;
    font-size: 18px;
    margin-left: 8px;
  }
  details.panel[open] > summary::after { transform: rotate(90deg); }
  .panel-body { padding: 10px 0 4px; }
  .panel-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .panel-row label {
    font-size: 12px;
    color: #6b6b70;
    width: 56px;
    flex-shrink: 0;
  }
  .panel-row select, .panel-row input[type="text"] {
    flex: 1;
    height: 36px;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    background: #f5f5f7;
    color: inherit;
    font-family: inherit;
    font-size: 14px;
    padding: 0 10px;
    min-width: 0;
  }
  .segmented {
    display: flex;
    gap: 0;
    background: #f2f2f7;
    border-radius: 8px;
    padding: 2px;
    flex: 1;
  }
  .segmented button {
    flex: 1;
    height: 32px;
    border: none;
    background: transparent;
    color: #6b6b70;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .segmented button.active {
    background: white;
    color: #1c1c1e;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  .panel-buttons {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .panel-buttons button {
    flex: 1;
    height: 36px;
    border-radius: 8px;
    border: 0.5px solid rgba(0,0,0,0.12);
    background: white;
    color: #1c1c1e;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .panel-buttons button:active { background: #f2f2f7; }
  .panel-buttons button.danger { color: #d23f3f; }
  .panel-buttons button.primary {
    background: #0f6e56;
    color: white;
    border-color: transparent;
  }
  .panel-buttons button.primary:active { background: #0c5a47; }
  .storage-status {
    font-size: 12px;
    color: #6b6b70;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .storage-status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    background: #c7c7cc;
  }
  .storage-status .dot.ok { background: #0f6e56; }
  .storage-status .dot.warn { background: #c47200; }

  .par-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 12px 0 6px;
  }
  .par-cell {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
  }
  .par-cell span { color: #6b6b70; width: 28px; }
  .par-cell select {
    flex: 1;
    height: 32px;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 6px;
    background: #f5f5f7;
    color: inherit;
    font-family: inherit;
    font-size: 13px;
    padding: 0 6px;
  }

  .holes {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hole {
    display: grid;
    grid-template-columns: 56px 1fr 60px;
    align-items: center;
    gap: 12px;
    background: white;
    border-radius: 12px;
    padding: 10px 12px;
    border: 0.5px solid rgba(0,0,0,0.08);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .hole.next {
    border-color: #0f6e56;
    box-shadow: 0 0 0 2px rgba(15, 110, 86, 0.15);
  }
  .nine-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 6px 2px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #8e8e93;
    font-weight: 600;
  }
  .nine-divider::before,
  .nine-divider::after {
    content: "";
    flex: 1;
    height: 0.5px;
    background: rgba(0,0,0,0.08);
  }
  .hole-num {
    font-size: 16px;
    font-weight: 600;
  }
  .hole-par {
    font-size: 11px;
    color: #8e8e93;
    margin-top: 2px;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stepper button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: #f2f2f7;
    color: #1c1c1e;
    font-size: 22px;
    font-weight: 400;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.05s;
    flex-shrink: 0;
  }
  .stepper button:active {
    background: #d1d1d6;
    transform: scale(0.94);
  }
  .stepper .score {
    flex: 1;
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    min-width: 32px;
    letter-spacing: -0.5px;
    padding: 4px 0;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
  }
  .stepper .score:active { background: rgba(0,0,0,0.04); }
  .score.empty { color: #c7c7cc; font-weight: 400; }
  .score.bump { animation: scoreBump 0.28s ease-out; }
  @keyframes scoreBump {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .label {
    font-size: 11px;
    text-align: right;
    font-weight: 500;
    text-transform: lowercase;
  }
  .label.par { color: #8e8e93; }
  .label.under { color: #0f6e56; }
  .label.bogey { color: #c47200; }
  .label.over { color: #d23f3f; }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    height: 44px;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.12);
    background: white;
    color: #1c1c1e;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn:active { background: #f2f2f7; }
  .btn.danger { color: #d23f3f; }
  .btn.primary {
    background: #0f6e56;
    color: white;
    border-color: transparent;
  }
  .btn.primary:active { background: #0c5a47; }
  .btn.success {
    background: #d4f0e3;
    color: #0f6e56;
    border-color: transparent;
  }
  .btn.active {
    background: #1c1c1e;
    color: white;
    border-color: transparent;
  }
  .actions-secondary {
    display: flex;
    justify-content: center;
    margin-top: 12px;
  }
  .reset-link {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: inherit;
    border-radius: 8px;
  }
  .reset-link:active { color: #d23f3f; background: rgba(210, 63, 63, 0.08); }

  /* Stats */
  .stats-block {
    background: white;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 0.5px solid rgba(0,0,0,0.08);
  }
  .stats-title {
    font-size: 11px;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .stats-headline {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
  }
  .stats-headline .v {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }
  .stats-headline .l {
    font-size: 10px;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .stats-headline .sub {
    font-size: 11px;
    color: #8e8e93;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stats-dist {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .stats-dist .pill {
    background: #f5f5f7;
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
    font-size: 11px;
  }
  .stats-dist .pill .count {
    font-size: 16px;
    font-weight: 600;
    display: block;
    letter-spacing: -0.3px;
  }
  .stats-dist .pill .lbl { color: #8e8e93; }
  .stats-dist .pill.under .count { color: #0f6e56; }
  .stats-dist .pill.bogey .count { color: #c47200; }
  .stats-dist .pill.over .count { color: #d23f3f; }
  .stats-courses {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stats-course {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    padding: 6px 0;
    border-top: 0.5px solid rgba(0,0,0,0.06);
  }
  .stats-course:first-child { border-top: none; }
  .stats-course .name { font-weight: 500; }
  .stats-course .meta { font-size: 11px; color: #8e8e93; }
  .stats-course .best { font-size: 12px; font-weight: 600; }

  /* History expand */
  .history-row { cursor: pointer; }
  .history-detail {
    grid-column: 1 / -1;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 0.5px solid rgba(0,0,0,0.08);
  }
  .history-detail-section {
    margin-bottom: 8px;
  }
  .history-detail-title {
    font-size: 11px;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .hole-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 2px;
    font-size: 11px;
    text-align: center;
  }
  .hole-grid .cell {
    padding: 4px 2px;
    border-radius: 4px;
    background: #f5f5f7;
  }
  .hole-grid .cell.header { color: #8e8e93; background: transparent; font-size: 10px; }
  .hole-grid .cell.score-under { background: #d4f0e3; color: #0f6e56; font-weight: 600; }
  .hole-grid .cell.score-over  { background: #fde0db; color: #d23f3f; font-weight: 600; }
  .hole-grid .cell.score-bogey { background: #fdebd0; color: #c47200; font-weight: 600; }
  .hole-grid .cell.empty { color: #c7c7cc; }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
    animation: fadeIn 0.15s ease-out;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: white;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    animation: slideUp 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes slideUp {
    from { transform: translateY(24px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .modal-title:empty { display: none; }
  .modal-message {
    font-size: 14px;
    color: #3a3a3c;
    line-height: 1.4;
    margin-bottom: 14px;
  }
  .modal-message:empty { display: none; }
  .modal input.modal-input, .modal select.modal-input {
    width: 100%;
    height: 40px;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    background: #f5f5f7;
    color: inherit;
    font-family: inherit;
    font-size: 15px;
    padding: 0 12px;
    margin-bottom: 14px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
  }
  .modal-actions button {
    flex: 1;
    height: 40px;
    border-radius: 10px;
    border: 0.5px solid rgba(0,0,0,0.12);
    background: white;
    color: #1c1c1e;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .modal-actions button:active { background: #f2f2f7; }
  .modal-actions button.primary {
    background: #0f6e56;
    color: white;
    border-color: transparent;
  }
  .modal-actions button.primary.danger {
    background: #d23f3f;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Score keypad */
  .score-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .score-keypad button {
    height: 52px;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.12);
    background: #f5f5f7;
    color: #1c1c1e;
    font-size: 22px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.05s, transform 0.05s;
  }
  .score-keypad button:active {
    background: #d1d1d6;
    transform: scale(0.96);
  }
  .score-keypad button.par {
    background: #d4f0e3;
    color: #0f6e56;
    border-color: transparent;
  }
  .score-keypad-meta {
    font-size: 12px;
    color: #8e8e93;
    text-align: center;
    margin-bottom: 12px;
    margin-top: -4px;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f6e56;
    color: white;
    padding: 12px 20px;
    border-radius: 4px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* Course form page */
  .course-form-view {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #f5f5f7;
    display: flex;
    flex-direction: column;
  }
  .course-form-view[hidden] { display: none; }
  .course-form-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #0f6e56;
    color: white;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  }
  .course-form-header button {
    background: transparent;
    border: none;
    color: white;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    padding: 4px 2px;
  }
  .course-form-header .cf-save { font-weight: 600; }
  .course-form-title { font-size: 16px; font-weight: 600; }
  .course-form-body {
    flex: 1;
    overflow-y: auto;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 16px 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .cf-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8e8e93;
    margin: 16px 0 5px;
  }
  .cf-label:first-child { margin-top: 0; }
  .cf-name {
    width: 100%;
    height: 40px;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    background: white;
    color: inherit;
    font-family: inherit;
    font-size: 15px;
    padding: 0 12px;
  }
  .cf-hint {
    font-size: 12px;
    color: #d23f3f;
    min-height: 15px;
    margin-top: 6px;
  }
  .cf-par-total {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #6b6b70;
    margin-top: 16px;
  }

  .sticky-stack {
    position: sticky;
    top: env(safe-area-inset-top);
    z-index: 20;
    background: #f5f5f7;
    padding: 12px 0 12px;
    margin: -12px 0 12px;
  }
  .sticky-stack header { margin-bottom: 12px; }
  .sticky-stack .summary { margin-bottom: 0; }

  .menu-btn {
    background: transparent;
    border: 2px solid rgba(0, 0, 0, 0.15);
    color: #0f6e56;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    margin-left: 8px;
    -webkit-appearance: none;
    appearance: none;
  }
  .menu-btn:hover, .menu-btn:active {
    border-color: rgba(0, 0, 0, 0.3);
    background: rgba(0, 0, 0, 0.05);
  }

  .sparkline {
    display: grid;
    gap: 2px;
    height: 30px;
    margin-top: 14px;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .sparkline::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: rgba(255, 255, 255, 0.22);
    transform: translateY(-0.5px);
    pointer-events: none;
  }
  .spark-col {
    position: relative;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.1s;
  }
  .spark-col:active { background: rgba(255, 255, 255, 0.12); }
  .spark-bar {
    position: absolute;
    left: 15%;
    right: 15%;
    border-radius: 2px;
    min-height: 2px;
  }
  .spark-bar.under { background: #a8e6cf; }
  .spark-bar.par   { background: rgba(255, 255, 255, 0.7); }
  .spark-bar.over  { background: #ffb4a8; }
  .spark-bar.empty {
    background: rgba(255, 255, 255, 0.18);
    top: calc(50% - 1px);
    height: 2px;
    left: 30%;
    right: 30%;
  }

  .label-cell {
    text-align: right;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    min-width: 0;
  }
  .running {
    font-size: 10px;
    font-weight: 500;
    color: #8e8e93;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2px;
    min-height: 12px;
  }
  .running.under { color: #0f6e56; }
  .running.over  { color: #d23f3f; }

  .settings-view {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: #f5f5f7;
    display: flex;
    flex-direction: column;
  }
  .settings-view[hidden] { display: none; }
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #0f6e56;
    color: white;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  }
  .settings-header button {
    background: transparent;
    border: none;
    color: white;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    padding: 4px 2px;
    min-width: 56px;
    text-align: left;
  }
  .settings-header .settings-title { font-size: 16px; font-weight: 600; }
  .settings-header .settings-spacer { width: 56px; }
  .settings-body {
    flex: 1;
    overflow-y: auto;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 16px 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .settings-section {
    background: white;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    border: 0.5px solid rgba(0, 0, 0, 0.08);
  }
  .settings-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8e8e93;
    margin-bottom: 12px;
  }
  .settings-section .panel-row:last-child,
  .settings-section .panel-buttons:last-child { margin-bottom: 0; }

  @media (prefers-color-scheme: dark) {
    html, body { background: #000; color: #f5f5f7; }
    .hole, details.panel, .btn, .panel-buttons button { background: #1c1c1e; color: #f5f5f7; border-color: rgba(255,255,255,0.08); }
    .stepper button { background: #2c2c2e; color: #f5f5f7; }
    .stepper button:active { background: #3a3a3c; }
    .par-cell select, .panel-row select, .panel-row input[type="text"] { background: #2c2c2e; color: #f5f5f7; border-color: rgba(255,255,255,0.12); }
    .segmented { background: #2c2c2e; }
    .segmented button { color: #8e8e93; }
    .segmented button.active { background: #48484a; color: #f5f5f7; box-shadow: none; }
    .hole-par, .par-cell span, details.panel > summary, .panel-row label { color: #8e8e93; }
    .header-meta { color: #8e8e93; }
    .header-meta .course-name { color: #f5f5f7; }
    .score.empty { color: #48484a; }
    .modal { background: #1c1c1e; }
    .modal-message { color: #c7c7cc; }
    .modal input.modal-input, .modal select.modal-input { background: #2c2c2e; color: #f5f5f7; border-color: rgba(255,255,255,0.12); }
    .modal-actions button { background: #2c2c2e; color: #f5f5f7; border-color: rgba(255,255,255,0.1); }
    .modal-actions button:active { background: #3a3a3c; }
    .storage-status { color: #8e8e93; }
    .stats-block { background: #1c1c1e; border-color: rgba(255,255,255,0.08); }
    .stats-dist .pill { background: #2c2c2e; }
    .stats-course { border-top-color: rgba(255,255,255,0.06); }
    .hole-grid .cell { background: #2c2c2e; }
    .hole-grid .cell.score-under { background: #1d3d2e; color: #6dcfa0; }
    .hole-grid .cell.score-over  { background: #3d1d1d; color: #ff9080; }
    .hole-grid .cell.score-bogey { background: #3a2d10; color: #e0a050; }
    .history-detail { border-top-color: rgba(255,255,255,0.08); }
    .splits { border-top-color: rgba(255,255,255,0.18); }
    .hole.next { border-color: #4dbf9e; box-shadow: 0 0 0 2px rgba(77, 191, 158, 0.18); }
    .nine-divider { color: #8e8e93; }
    .nine-divider::before, .nine-divider::after { background: rgba(255,255,255,0.1); }
    .score-keypad button { background: #2c2c2e; color: #f5f5f7; border-color: rgba(255,255,255,0.08); }
    .score-keypad button:active { background: #3a3a3c; }
    .score-keypad button.par { background: #1d3d2e; color: #6dcfa0; }
    .btn.success { background: #1d3d2e; color: #6dcfa0; }
    .btn.active { background: #f5f5f7; color: #1c1c1e; }
    .reset-link { color: #8e8e93; }
    .reset-link:active { color: #ff9080; background: rgba(255, 144, 128, 0.1); }
    .toast {
      background: #0f6e56;
      color: #f5f5f7;
    }
    .course-form-view { background: #000; }
    .cf-name { background: #2c2c2e; color: #f5f5f7; border-color: rgba(255,255,255,0.12); }
    .cf-par-total { color: #8e8e93; }
    .cf-hint { color: #ff9080; }
    .sticky-stack { background: #000; }
    .menu-btn { border-color: rgba(255, 255, 255, 0.5); color: white; }
    .menu-btn:hover, .menu-btn:active {
      border-color: white;
      background: rgba(255, 255, 255, 0.1);
    }
    .running { color: #8e8e93; }
    .running.under { color: #6dcfa0; }
    .running.over  { color: #ff9080; }
    .settings-view { background: #000; }
    .settings-section { background: #1c1c1e; border-color: rgba(255, 255, 255, 0.08); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="sticky-stack">
    <header>
      <h1 id="courseName">—</h1>
      <div class="header-meta">
        <button class="new-round-btn" id="newRoundBtn" aria-label="Start new round">+</button>
        <button class="date-btn" id="dateBtn" aria-label="Change round date"></button>
        <input type="date" id="dateInput" aria-hidden="true" tabindex="-1">
        <button class="menu-btn" id="settingsBtn" aria-label="Open settings">⋮</button>
      </div>
    </header>

    <div class="summary">
      <div class="summary-hero">
        <div class="summary-hero-value" id="toPar">E</div>
        <div class="summary-hero-label">to par</div>
      </div>
      <div class="summary-sub">
        <span>Total <b id="total">0</b></span>
        <span>Thru <b id="thru">0</b></span>
      </div>
      <div class="splits" id="splits" hidden></div>
      <div class="sparkline" id="sparkline" aria-label="Per-hole trajectory"></div>
    </div>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <div class="holes" id="holes"></div>

  <div class="actions">
    <button class="btn primary" id="save">Save round</button>
    <button class="btn" id="history">History</button>
  </div>
  <div class="actions-secondary">
    <button class="reset-link" id="reset">Reset round</button>
  </div>

  <div id="historyView" style="display:none; margin-top: 16px;"></div>
</div>

<div class="course-form-view" id="courseFormView" hidden>
  <div class="course-form-header">
    <button id="courseFormCancel">Cancel</button>
    <span class="course-form-title" id="courseFormTitle">New course</span>
    <button id="courseFormSave" class="cf-save">Save</button>
  </div>
  <div class="course-form-body">
    <div class="cf-label">Name</div>
    <input type="text" class="cf-name" id="courseFormName" placeholder="Course name" autocomplete="off" autocapitalize="words">
    <div class="cf-hint" id="courseFormHint"></div>
    <div class="cf-label">Holes</div>
    <div class="segmented" id="courseFormHoles">
      <button data-holes="9">9</button>
      <button data-holes="18">18</button>
    </div>
    <div class="cf-label">Par per hole</div>
    <div class="par-grid" id="courseFormPars"></div>
    <div class="cf-par-total" id="courseFormParTotal">Par 72</div>
  </div>
</div>

<div class="settings-view" id="settingsView" hidden>
  <div class="settings-header">
    <button id="settingsClose">Close</button>
    <span class="settings-title">Settings</span>
    <span class="settings-spacer"></span>
  </div>
  <div class="settings-body">
    <div class="settings-section">
      <div class="settings-section-title">Course</div>
      <div class="panel-row">
        <label>Course</label>
        <select id="courseSelect"></select>
      </div>
      <div class="panel-buttons">
        <button id="newCourse" class="primary">+ Add course</button>
      </div>
      <div class="panel-buttons">
        <button id="editCourse">Edit</button>
        <button id="deleteCourse" class="danger">Delete</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Backup</div>
      <div class="storage-status" id="storageStatus">Checking storage…</div>
      <div class="panel-buttons">
        <button id="exportBackup">Export</button>
        <button id="importBackup">Import</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div class="modal-backdrop" id="scoreModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="scoreModalTitle"></div>
    <div class="score-keypad-meta" id="scoreModalMeta"></div>
    <div class="score-keypad" id="scoreKeypad"></div>
    <div class="modal-actions">
      <button id="scoreClear" class="danger">Clear hole</button>
      <button id="scoreCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-message" id="modalMessage"></div>
    <input type="text" class="modal-input" id="modalTextInput" hidden>
    <select class="modal-input" id="modalSelectInput" hidden></select>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk" class="primary">OK</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmRoundModal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="confirmRoundTitle">Save round before starting new?</div>
    <div class="modal-message" id="confirmRoundMessage"></div>
    <div class="modal-actions">
      <button id="confirmRoundSaveBtn" class="primary">Save & New</button>
      <button id="confirmRoundDiscardBtn">Discard & New</button>
      <button id="confirmRoundCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
(function() {
  const COURSES_KEY = 'golf_courses_v1';
  const ROUND_KEY = 'golf_round_v2';
  const LEGACY_ROUND_KEY = 'golf_round_v1';
  const HISTORY_KEY = 'golf_history_v1';

  const DEFAULT_PARS_18 = [4,4,3,5,4,4,3,4,5,4,4,3,5,4,4,3,4,5];
  const DEFAULT_PARS_9  = [4,4,3,5,4,4,3,4,5];

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function defaultPars(holes) {
    return (holes === 9 ? DEFAULT_PARS_9 : DEFAULT_PARS_18).slice();
  }

  function loadCourses() {
    try {
      const raw = JSON.parse(localStorage.getItem(COURSES_KEY) || 'null');
      if (raw && Array.isArray(raw.courses) && raw.courses.length) return raw;
    } catch(e) {}
    return null;
  }
  function saveCourses() {
    try { localStorage.setItem(COURSES_KEY, JSON.stringify({ courses, currentId })); } catch(e) {}
  }

  function loadRound() {
    try {
      const raw = JSON.parse(localStorage.getItem(ROUND_KEY) || 'null');
      if (raw && Array.isArray(raw.scores)) return raw;
    } catch(e) {}
    return null;
  }
  function saveRound() {
    try { localStorage.setItem(ROUND_KEY, JSON.stringify(round)); } catch(e) {}
  }

  // --- Initialise courses (with migration from v1) ---
  let courses, currentId;
  const stored = loadCourses();
  if (stored) {
    courses = stored.courses;
    currentId = stored.currentId && courses.find(c => c.id === stored.currentId) ? stored.currentId : courses[0].id;
  } else {
    // Migration: pull pars from legacy round if present
    let migratedPars = null;
    try {
      const legacy = JSON.parse(localStorage.getItem(LEGACY_ROUND_KEY) || 'null');
      if (legacy && Array.isArray(legacy.pars) && legacy.pars.length === 18) migratedPars = legacy.pars.slice();
    } catch(e) {}
    courses = [{
      id: uid(),
      name: 'My Course',
      holes: 18,
      pars: migratedPars || DEFAULT_PARS_18.slice()
    }];
    currentId = courses[0].id;
    saveCourses();
  }

  function currentCourse() {
    return courses.find(c => c.id === currentId) || courses[0];
  }

  // --- Initialise round ---
  let round = loadRound();
  if (!round || round.courseId !== currentId || !Array.isArray(round.scores) || round.scores.length !== currentCourse().holes) {
    // Try legacy round once
    if (!round) {
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_ROUND_KEY) || 'null');
        if (legacy && Array.isArray(legacy.scores) && legacy.scores.length === 18 && currentCourse().holes === 18) {
          round = { courseId: currentId, scores: legacy.scores.slice(), date: legacy.date || Date.now() };
        }
      } catch(e) {}
    }
    if (!round || round.courseId !== currentId || round.scores.length !== currentCourse().holes) {
      round = newRound(currentId);
    }
    saveRound();
  }

  function newRound(courseId) {
    const c = courses.find(x => x.id === courseId) || courses[0];
    return { courseId: c.id, scores: Array(c.holes).fill(null), date: Date.now() };
  }

  // --- DOM refs ---
  const holesEl       = document.getElementById('holes');
  const courseSelect  = document.getElementById('courseSelect');
  const courseNameEl  = document.getElementById('courseName');
  const dateBtn       = document.getElementById('dateBtn');
  const dateInput     = document.getElementById('dateInput');
  const splitsEl      = document.getElementById('splits');
  const sparklineEl   = document.getElementById('sparkline');

  // --- Modal dialogs (replace native confirm/prompt) ---
  const modalEl       = document.getElementById('modal');
  const modalTitle    = document.getElementById('modalTitle');
  const modalMessage  = document.getElementById('modalMessage');
  const modalTextIn   = document.getElementById('modalTextInput');
  const modalSelectIn = document.getElementById('modalSelectInput');
  const modalOk       = document.getElementById('modalOk');
  const modalCancel   = document.getElementById('modalCancel');

  function showModal(opts) {
    return new Promise((resolve) => {
      modalTitle.textContent = opts.title || '';
      modalMessage.textContent = opts.message || '';
      modalTextIn.hidden = !opts.text;
      modalSelectIn.hidden = !opts.select;

      if (opts.text) {
        modalTextIn.value = opts.text.value ?? '';
        modalTextIn.placeholder = opts.text.placeholder || '';
      }
      if (opts.select) {
        modalSelectIn.innerHTML = opts.select.options
          .map(o => `<option value="${escapeHtml(String(o.value))}"${o.value === opts.select.value ? ' selected' : ''}>${escapeHtml(o.label)}</option>`)
          .join('');
      }

      modalOk.textContent  = opts.okText || 'OK';
      modalCancel.textContent = opts.cancelText || 'Cancel';
      modalCancel.hidden = opts.cancelText === null;
      modalOk.classList.toggle('danger', !!opts.destructive);

      const cleanup = () => {
        modalEl.hidden = true;
        modalOk.onclick = null;
        modalCancel.onclick = null;
        modalEl.onclick = null;
        document.removeEventListener('keydown', onKey);
      };
      const submit = () => {
        const result = {};
        if (opts.text)   result.text = modalTextIn.value.trim();
        if (opts.select) result.select = modalSelectIn.value;
        cleanup();
        resolve(opts.text || opts.select ? result : true);
      };
      const cancel = () => { cleanup(); resolve(null); };
      const onKey = (e) => {
        if (e.key === 'Escape') cancel();
        else if (e.key === 'Enter' && !opts.select) submit();
      };

      modalOk.onclick = submit;
      modalCancel.onclick = cancel;
      modalEl.onclick = (e) => { if (e.target === modalEl) cancel(); };
      document.addEventListener('keydown', onKey);

      modalEl.hidden = false;
      if (opts.text) setTimeout(() => modalTextIn.focus(), 50);
    });
  }

  const confirmDialog = (message, { title = '', okText = 'OK', destructive = false } = {}) =>
    showModal({ title, message, okText, destructive }).then(r => r !== null);
  const promptDialog = (message, defaultValue = '', { title = '', placeholder = '', okText = 'OK' } = {}) =>
    showModal({ title, message, okText, text: { value: defaultValue, placeholder } }).then(r => r ? r.text : null);
  const alertDialog = (message, { title = '' } = {}) =>
    showModal({ title, message, cancelText: null });

  let toastTimeout;

  function showToast(message, duration = 2000) {
    const toastEl = document.getElementById('toast');
    clearTimeout(toastTimeout);
    toastEl.textContent = message;
    toastEl.classList.add('show');
    toastTimeout = setTimeout(() => {
      toastEl.classList.remove('show');
    }, duration);
  }

  function labelFor(score, par) {
    if (score == null) return { text: '', cls: '' };
    const diff = score - par;
    if (diff === 0) return { text: 'par', cls: 'par' };
    if (diff === -1) return { text: 'birdie', cls: 'under' };
    if (diff === -2) return { text: 'eagle', cls: 'under' };
    if (diff <= -3) return { text: 'albatross', cls: 'under' };
    if (diff === 1) return { text: 'bogey', cls: 'bogey' };
    if (diff === 2) return { text: 'double', cls: 'over' };
    if (diff === 3) return { text: 'triple', cls: 'over' };
    return { text: '+' + diff, cls: 'over' };
  }

  function runningDiffThrough(scores, pars, throughIdx) {
    if (scores[throughIdx] == null) return null;
    let s = 0, p = 0;
    for (let i = 0; i <= throughIdx; i++) {
      if (scores[i] != null) {
        s += scores[i];
        p += pars[i];
      }
    }
    return s - p;
  }

  function runningDisplay(diff) {
    if (diff == null) return { text: '', cls: '' };
    if (diff === 0)   return { text: 'E', cls: 'par' };
    if (diff < 0)     return { text: String(diff), cls: 'under' };
    return { text: '+' + diff, cls: 'over' };
  }

  function renderHeader() {
    const c = currentCourse();
    courseNameEl.textContent = c.name;
    const d = new Date(round.date);
    dateBtn.textContent = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function isoLocal(ts) {
    const d = new Date(ts);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  // --- Confirmation dialog state ---
  let pendingRoundAction = null; // 'new' or 'switch'
  let pendingCourseId = null; // courseId to switch to, if action is 'switch'

  function showConfirmRoundDialog(action, courseIdOrDate = null) {
    const title = document.getElementById('confirmRoundTitle');
    const message = document.getElementById('confirmRoundMessage');
    const saveBtn = document.getElementById('confirmRoundSaveBtn');
    const discardBtn = document.getElementById('confirmRoundDiscardBtn');
    const modal = document.getElementById('confirmRoundModal');

    const roundDate = new Date(round.date).toLocaleDateString(undefined, {
      month: 'short',
      day: 'numeric'
    });

    pendingRoundAction = action;

    if (action === 'new') {
      title.textContent = `Save round from ${roundDate} before starting new?`;
      message.textContent = '';
      saveBtn.textContent = 'Save & New';
      discardBtn.textContent = 'Discard & New';
    } else if (action === 'switch') {
      pendingCourseId = courseIdOrDate;
      title.textContent = `Save round from ${roundDate} before switching?`;
      message.textContent = '';
      saveBtn.textContent = 'Save & Switch';
      discardBtn.textContent = 'Discard & Switch';
    }

    modal.hidden = false;
  }

  // --- Save button handler ---
  document.getElementById('confirmRoundSaveBtn').addEventListener('click', async () => {
    const action = pendingRoundAction;
    const courseId = pendingCourseId;

    // Close dialog
    document.getElementById('confirmRoundModal').hidden = true;

    // Save the current round
    const c = currentCourse();
    const played = round.scores.filter(s => s != null);

    if (played.length === 0) {
      await alertDialog('No scores to save yet.');
      return;
    }

    const total = played.reduce((a, b) => a + b, 0);
    const parTotal = round.scores.reduce((acc, s, i) => s == null ? acc : acc + c.pars[i], 0);
    const entry = {
      id: uid(),
      date: round.date,
      courseId: c.id,
      courseName: c.name,
      holes: c.holes,
      scores: round.scores.slice(),
      pars: c.pars.slice(),
      total,
      toPar: total - parTotal,
      thru: played.length
    };

    const h = loadHistory();
    h.unshift(entry);
    if (!saveHistory(h)) {
      await alertDialog('Could not save — device storage is full. Delete old rounds or export a backup, then try again.', { title: 'Save failed' });
      return;
    }
    markRoundSaved();
    showToast('Round saved');

    // Proceed with the action
    if (action === 'new') {
      round = newRound(currentId);
      saveRound();
      render();
    } else if (action === 'switch') {
      currentId = courseId;
      saveCourses();
      round = newRound(currentId);
      saveRound();
      render();
    }
  });

  // --- Discard button handler ---
  document.getElementById('confirmRoundDiscardBtn').addEventListener('click', () => {
    const action = pendingRoundAction;
    const courseId = pendingCourseId;

    // Close dialog
    document.getElementById('confirmRoundModal').hidden = true;
    showToast('Round discarded');

    // Proceed with the action
    if (action === 'new') {
      round = newRound(currentId);
      saveRound();
      render();
    } else if (action === 'switch') {
      currentId = courseId;
      saveCourses();
      round = newRound(currentId);
      saveRound();
      render();
    }
  });

  // --- Cancel button handler ---
  document.getElementById('confirmRoundCancelBtn').addEventListener('click', () => {
    document.getElementById('confirmRoundModal').hidden = true;
  });

  dateBtn.addEventListener('click', () => {
    dateInput.value = isoLocal(round.date);
    if (typeof dateInput.showPicker === 'function') {
      try { dateInput.showPicker(); return; } catch(e) {}
    }
    dateInput.focus();
    dateInput.click();
  });

  dateInput.addEventListener('change', () => {
    if (!dateInput.value) return;
    const [y, m, d] = dateInput.value.split('-').map(Number);
    const dt = new Date(round.date);
    dt.setFullYear(y, m - 1, d);
    round.date = dt.getTime();
    saveRound();
    renderHeader();
  });

  function renderCoursePanel() {
    courseSelect.innerHTML = courses.map(co =>
      `<option value="${co.id}" ${co.id === currentId ? 'selected' : ''}>${escapeHtml(co.name)} · ${co.holes}</option>`
    ).join('');
  }

  function nextUnfilledIndex() {
    return round.scores.findIndex(s => s == null);
  }

  function renderHoles() {
    const c = currentCourse();
    holesEl.innerHTML = '';
    const nextIdx = nextUnfilledIndex();

    for (let i = 0; i < c.holes; i++) {
      if (c.holes === 18 && i === 9) {
        const div = document.createElement('div');
        div.className = 'nine-divider';
        div.innerHTML = '<span>Back 9</span>';
        holesEl.appendChild(div);
      }

      const par = c.pars[i];
      const score = round.scores[i];
      const lbl = labelFor(score, par);
      const run = runningDisplay(runningDiffThrough(round.scores, c.pars, i));

      const row = document.createElement('div');
      row.className = 'hole' + (i === nextIdx ? ' next' : '');
      row.dataset.holeRow = i;
      row.innerHTML = `
        <div>
          <div class="hole-num">${i + 1}</div>
          <div class="hole-par">par ${par}</div>
        </div>
        <div class="stepper">
          <button data-hole="${i}" data-action="dec" aria-label="Decrease score">−</button>
          <div class="score ${score == null ? 'empty' : ''}" data-score-hole="${i}" role="button" aria-label="Set score for hole ${i + 1}">${score == null ? '–' : score}</div>
          <button data-hole="${i}" data-action="inc" aria-label="Increase score">+</button>
        </div>
        <div class="label-cell">
          <div class="label ${lbl.cls}">${lbl.text}</div>
          <div class="running ${run.cls}">${run.text}</div>
        </div>
      `;
      holesEl.appendChild(row);
    }
  }

  function refreshRunningAll() {
    const c = currentCourse();
    for (let i = 0; i < c.holes; i++) {
      const row = holesEl.querySelector(`.hole[data-hole-row="${i}"]`);
      if (!row) continue;
      const run = runningDisplay(runningDiffThrough(round.scores, c.pars, i));
      const runEl = row.querySelector('.running');
      if (runEl) {
        runEl.className = 'running ' + run.cls;
        runEl.textContent = run.text;
      }
    }
  }

  function renderSparkline() {
    const c = currentCourse();
    sparklineEl.style.gridTemplateColumns = `repeat(${c.holes}, 1fr)`;
    const max = 4;
    const cells = [];
    for (let i = 0; i < c.holes; i++) {
      const s = round.scores[i];
      if (s == null) {
        cells.push(`<div class="spark-col" data-hole="${i}"><div class="spark-bar empty"></div></div>`);
        continue;
      }
      const diff = s - c.pars[i];
      if (diff === 0) {
        cells.push(`<div class="spark-col" data-hole="${i}"><div class="spark-bar par" style="top:calc(50% - 3px); height:6px;"></div></div>`);
        continue;
      }
      const mag = Math.min(Math.abs(diff), max);
      const halfPct = (mag / max) * 46;
      const cls = diff < 0 ? 'under' : 'over';
      const top = diff < 0 ? '50%' : `calc(50% - ${halfPct}%)`;
      const height = `${halfPct}%`;
      cells.push(`<div class="spark-col" data-hole="${i}"><div class="spark-bar ${cls}" style="top:${top}; height:${height};"></div></div>`);
    }
    sparklineEl.innerHTML = cells.join('');
  }

  function updateHoleRow(i, opts = {}) {
    const c = currentCourse();
    const par = c.pars[i];
    const score = round.scores[i];
    const lbl = labelFor(score, par);
    const row = holesEl.querySelector(`.hole[data-hole-row="${i}"]`);
    if (!row) return;

    const scoreEl = row.querySelector('.score');
    scoreEl.textContent = score == null ? '–' : score;
    scoreEl.classList.toggle('empty', score == null);

    const labelEl = row.querySelector('.label');
    labelEl.className = 'label ' + lbl.cls;
    labelEl.textContent = lbl.text;

    if (opts.bump) {
      scoreEl.classList.remove('bump');
      // force reflow so the animation restarts
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
    }

    // Refresh `.next` ring across all rows.
    const nextIdx = nextUnfilledIndex();
    holesEl.querySelectorAll('.hole').forEach(r => {
      r.classList.toggle('next', parseInt(r.dataset.holeRow, 10) === nextIdx);
    });
  }

  function scrollToNextHole({ smooth = true } = {}) {
    const nextIdx = nextUnfilledIndex();
    if (nextIdx < 0) return;
    const row = holesEl.querySelector(`.hole[data-hole-row="${nextIdx}"]`);
    if (!row) return;
    const rect = row.getBoundingClientRect();
    const vh = window.innerHeight;
    if (rect.top < 80 || rect.bottom > vh - 80) {
      row.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
    }
  }

  function diffStr(diff) {
    if (diff === 0) return 'E';
    return diff > 0 ? '+' + diff : String(diff);
  }

  function splitTotals(scores, pars, from, to) {
    let score = 0, par = 0, played = 0;
    for (let i = from; i < to; i++) {
      if (scores[i] != null) {
        score += scores[i];
        par += pars[i];
        played++;
      }
    }
    return { score, par, played, diff: score - par };
  }

  function updateSummary() {
    const c = currentCourse();
    const played = round.scores.filter(s => s != null);
    const total = played.reduce((a,b) => a + b, 0);
    const parTotal = round.scores.reduce((acc, s, i) => s == null ? acc : acc + c.pars[i], 0);
    const diff = total - parTotal;

    document.getElementById('total').textContent = total;
    document.getElementById('thru').textContent = `${played.length}/${c.holes}`;
    const toParEl = document.getElementById('toPar');
    toParEl.classList.remove('danger', 'info');
    if (played.length === 0 || diff === 0) {
      toParEl.textContent = 'E';
    } else if (diff > 0) {
      toParEl.textContent = '+' + diff;
      toParEl.classList.add('danger');
    } else {
      toParEl.textContent = String(diff);
      toParEl.classList.add('info');
    }

    if (c.holes === 18) {
      const out = splitTotals(round.scores, c.pars, 0, 9);
      const inn = splitTotals(round.scores, c.pars, 9, 18);
      const fmt = (s) => s.played === 0
        ? '<b>—</b>'
        : `<b>${s.score}</b> <span class="diff">${diffStr(s.diff)}</span>`;
      splitsEl.innerHTML = `<span>Out ${fmt(out)}</span><span>In ${fmt(inn)}</span>`;
      splitsEl.hidden = false;
    } else {
      splitsEl.hidden = true;
    }
  }

  function render() {
    renderHeader();
    renderCoursePanel();
    renderHoles();
    renderSparkline();
    updateSummary();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[ch]));
  }

  // --- Saved-state tracking ---
  let roundSaved = false;
  const saveBtn = document.getElementById('save');
  function markRoundDirty() {
    if (roundSaved) {
      roundSaved = false;
      saveBtn.classList.remove('success');
      saveBtn.classList.add('primary');
      saveBtn.textContent = 'Save round';
    }
  }
  function markRoundSaved() {
    roundSaved = true;
    saveBtn.classList.remove('primary');
    saveBtn.classList.add('success');
    saveBtn.textContent = '✓ Saved';
  }

  function onScoreChanged(i) {
    saveRound();
    updateHoleRow(i, { bump: true });
    refreshRunningAll();
    renderSparkline();
    updateSummary();
    markRoundDirty();
    scrollToNextHole();
    if (navigator.vibrate) navigator.vibrate(5);
  }

  // --- Score stepper (+ / −) ---
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-hole]');
    if (!btn) return;
    const i = parseInt(btn.dataset.hole, 10);
    const action = btn.dataset.action;
    const c = currentCourse();
    const current = round.scores[i];
    if (action === 'inc') {
      round.scores[i] = current == null ? c.pars[i] : Math.min(current + 1, 25);
    } else {
      if (current == null) return;
      round.scores[i] = current - 1;
      if (round.scores[i] < 1) round.scores[i] = null;
    }
    onScoreChanged(i);
  });

  // --- Direct score entry (tap the number) ---
  const scoreModalEl   = document.getElementById('scoreModal');
  const scoreModalTitle = document.getElementById('scoreModalTitle');
  const scoreModalMeta  = document.getElementById('scoreModalMeta');
  const scoreKeypadEl   = document.getElementById('scoreKeypad');
  const scoreClearBtn   = document.getElementById('scoreClear');
  const scoreCancelBtn  = document.getElementById('scoreCancel');

  function openScoreKeypad(i) {
    const c = currentCourse();
    const par = c.pars[i];
    const current = round.scores[i];
    scoreModalTitle.textContent = `Hole ${i + 1}`;
    scoreModalMeta.textContent = `Par ${par}${current != null ? ` · currently ${current}` : ''}`;

    const max = 12;
    scoreKeypadEl.innerHTML = '';
    for (let n = 1; n <= max; n++) {
      const b = document.createElement('button');
      b.textContent = n;
      b.dataset.score = n;
      if (n === par) b.classList.add('par');
      scoreKeypadEl.appendChild(b);
    }

    const cleanup = () => {
      scoreModalEl.hidden = true;
      scoreKeypadEl.onclick = null;
      scoreClearBtn.onclick = null;
      scoreCancelBtn.onclick = null;
      scoreModalEl.onclick = null;
      document.removeEventListener('keydown', onKey);
    };
    const choose = (val) => {
      round.scores[i] = val;
      cleanup();
      onScoreChanged(i);
    };
    const cancel = () => cleanup();
    const onKey = (e) => {
      if (e.key === 'Escape') cancel();
    };

    scoreKeypadEl.onclick = (e) => {
      const b = e.target.closest('button[data-score]');
      if (!b) return;
      choose(parseInt(b.dataset.score, 10));
    };
    scoreClearBtn.onclick = () => {
      round.scores[i] = null;
      cleanup();
      onScoreChanged(i);
    };
    scoreCancelBtn.onclick = cancel;
    scoreModalEl.onclick = (e) => { if (e.target === scoreModalEl) cancel(); };
    document.addEventListener('keydown', onKey);

    scoreModalEl.hidden = false;
  }

  // --- Long-press a hole / tap the score number ---
  // Single handler so tapping the score opens the keypad and holding it (or
  // any non-button area of the row) clears the hole.
  let lpHole = null;
  let lpTimer = null;
  let lpFired = false;
  let lpStartX = 0, lpStartY = 0;
  const LP_DURATION = 550;
  const LP_MOVE_TOLERANCE = 10;

  function lpStart(holeIdx, x, y) {
    lpCancel();
    lpHole = holeIdx;
    lpFired = false;
    lpStartX = x; lpStartY = y;
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (lpHole == null) return;
      const i = lpHole;
      if (round.scores[i] != null) {
        round.scores[i] = null;
        lpFired = true; // suppress the subsequent click
        onScoreChanged(i);
        if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
      }
    }, LP_DURATION);
  }
  function lpCancel() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    lpHole = null;
  }

  holesEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button[data-hole]')) return;
    const row = e.target.closest('.hole[data-hole-row]');
    if (!row) return;
    lpStart(parseInt(row.dataset.holeRow, 10), e.clientX, e.clientY);
  });
  holesEl.addEventListener('pointermove', (e) => {
    if (lpTimer && (Math.abs(e.clientX - lpStartX) > LP_MOVE_TOLERANCE || Math.abs(e.clientY - lpStartY) > LP_MOVE_TOLERANCE)) {
      lpCancel();
    }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
    holesEl.addEventListener(ev, lpCancel)
  );

  // Tap the score number → open keypad (suppressed if long-press fired).
  holesEl.addEventListener('click', (e) => {
    const s = e.target.closest('[data-score-hole]');
    if (!s) return;
    if (e.target.closest('button[data-hole]')) return;
    if (lpFired) { lpFired = false; return; }
    openScoreKeypad(parseInt(s.dataset.scoreHole, 10));
  });

  // --- Course switching ---
  courseSelect.addEventListener('change', () => {
    const newId = courseSelect.value;
    if (newId === currentId) return;
    if (round.scores.some(s => s != null) && !roundSaved) {
      courseSelect.value = currentId;
      showConfirmRoundDialog('switch', newId);
      return;
    }
    currentId = newId;
    saveCourses();
    round = newRound(currentId);
    saveRound();
    markRoundDirty();
    render();
  });

  // --- Add / delete course ---
  document.getElementById('newCourse').addEventListener('click', () => {
    closeSettings();
    openCourseForm('add');
  });

  document.getElementById('deleteCourse').addEventListener('click', async () => {
    if (courses.length === 1) { await alertDialog('You need at least one course.'); return; }
    const c = currentCourse();
    const ok = await confirmDialog(`Delete course "${c.name}"?`, { okText: 'Delete', destructive: true });
    if (!ok) return;
    courses = courses.filter(x => x.id !== currentId);
    currentId = courses[0].id;
    saveCourses();
    round = newRound(currentId);
    saveRound();
    markRoundDirty();
    closeSettings();
    render();
  });

  // --- Course form page ---
  const courseFormView     = document.getElementById('courseFormView');
  const courseFormTitle    = document.getElementById('courseFormTitle');
  const courseFormName     = document.getElementById('courseFormName');
  const courseFormHint     = document.getElementById('courseFormHint');
  const courseFormHoles    = document.getElementById('courseFormHoles');
  const courseFormPars     = document.getElementById('courseFormPars');
  const courseFormParTotal = document.getElementById('courseFormParTotal');

  let courseFormMode = null;
  let courseFormEditId = null;
  let courseFormDraft = null;
  let courseFormInitial = null;

  function updateCourseFormParTotal() {
    courseFormParTotal.textContent = 'Par ' + courseFormDraft.pars.reduce((a, b) => a + b, 0);
  }

  function renderCourseForm() {
    courseFormHoles.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.holes, 10) === courseFormDraft.holes);
    });
    courseFormPars.innerHTML = '';
    for (let i = 0; i < courseFormDraft.holes; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'par-cell';
      wrap.innerHTML = `
        <span>H${i+1}</span>
        <select data-cf-par="${i}">
          <option value="3"${courseFormDraft.pars[i]===3?' selected':''}>3</option>
          <option value="4"${courseFormDraft.pars[i]===4?' selected':''}>4</option>
          <option value="5"${courseFormDraft.pars[i]===5?' selected':''}>5</option>
          <option value="6"${courseFormDraft.pars[i]===6?' selected':''}>6</option>
        </select>
      `;
      courseFormPars.appendChild(wrap);
    }
    updateCourseFormParTotal();
  }

  function openCourseForm(mode, courseId) {
    courseFormMode = mode;
    if (mode === 'edit') {
      const c = courses.find(x => x.id === courseId) || currentCourse();
      courseFormEditId = c.id;
      courseFormDraft = { name: c.name, holes: c.holes, pars: c.pars.slice() };
    } else {
      courseFormEditId = null;
      courseFormDraft = { name: '', holes: 18, pars: defaultPars(18) };
    }
    courseFormInitial = JSON.stringify(courseFormDraft);
    courseFormTitle.textContent = mode === 'edit' ? 'Edit course' : 'New course';
    courseFormHint.textContent = '';
    courseFormName.value = courseFormDraft.name;
    renderCourseForm();
    courseFormView.hidden = false;
    if (mode === 'add') courseFormName.focus();
  }

  async function closeCourseForm(force) {
    if (!force && JSON.stringify(courseFormDraft) !== courseFormInitial) {
      const ok = await confirmDialog('Discard changes?', { okText: 'Discard', destructive: true });
      if (!ok) return;
    }
    courseFormView.hidden = true;
    courseFormMode = null;
    courseFormEditId = null;
    courseFormDraft = null;
    courseFormInitial = null;
  }

  async function saveCourseForm() {
    const name = courseFormDraft.name.trim();
    if (!name) {
      courseFormHint.textContent = 'Enter a course name';
      courseFormName.focus();
      return;
    }
    if (courseFormMode === 'add') {
      const hasScores = round.scores.some(s => s != null);
      if (hasScores && !roundSaved) {
        const ok = await confirmDialog('Adding a course will clear the current round. Continue?', { okText: 'Add course', destructive: true });
        if (!ok) return;
      }
      const c = { id: uid(), name, holes: courseFormDraft.holes, pars: courseFormDraft.pars.slice() };
      courses.push(c);
      currentId = c.id;
      saveCourses();
      round = newRound(currentId);
      saveRound();
      markRoundDirty();
      closeCourseForm(true);
      render();
      return;
    }
    const c = courses.find(x => x.id === courseFormEditId);
    if (!c) { closeCourseForm(true); return; }
    const holesChanged = c.holes !== courseFormDraft.holes;
    const affectsRound = holesChanged && c.id === currentId;
    if (affectsRound) {
      const hasScores = round.scores.some(s => s != null);
      if (hasScores && !roundSaved) {
        const ok = await confirmDialog('Changing hole count will clear the in-progress round. Continue?', { okText: 'Change', destructive: true });
        if (!ok) return;
      }
    }
    c.name = name;
    c.holes = courseFormDraft.holes;
    c.pars = courseFormDraft.pars.slice();
    saveCourses();
    if (affectsRound) {
      round = newRound(currentId);
      saveRound();
      markRoundDirty();
    }
    closeCourseForm(true);
    render();
  }

  courseFormName.addEventListener('input', () => {
    courseFormDraft.name = courseFormName.value;
    if (courseFormName.value.trim()) courseFormHint.textContent = '';
  });

  courseFormHoles.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-holes]');
    if (!b) return;
    const newHoles = parseInt(b.dataset.holes, 10);
    if (newHoles === courseFormDraft.holes) return;
    if (newHoles > courseFormDraft.holes) {
      courseFormDraft.pars = courseFormDraft.pars.concat(defaultPars(18).slice(courseFormDraft.holes, newHoles));
    } else {
      courseFormDraft.pars = courseFormDraft.pars.slice(0, newHoles);
    }
    courseFormDraft.holes = newHoles;
    renderCourseForm();
  });

  courseFormPars.addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-cf-par]');
    if (!sel) return;
    courseFormDraft.pars[parseInt(sel.dataset.cfPar, 10)] = parseInt(sel.value, 10);
    updateCourseFormParTotal();
  });

  document.getElementById('courseFormSave').addEventListener('click', saveCourseForm);
  document.getElementById('courseFormCancel').addEventListener('click', () => closeCourseForm(false));
  document.getElementById('editCourse').addEventListener('click', () => {
    closeSettings();
    openCourseForm('edit', currentId);
  });

  // --- Settings sheet ---
  const settingsView = document.getElementById('settingsView');
  function openSettings()  { settingsView.hidden = false; }
  function closeSettings() { settingsView.hidden = true; }
  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !settingsView.hidden) closeSettings();
  });

  // --- Sparkline tap → scroll to that hole ---
  sparklineEl.addEventListener('click', (e) => {
    const col = e.target.closest('.spark-col');
    if (!col) return;
    const i = parseInt(col.dataset.hole, 10);
    const row = holesEl.querySelector(`.hole[data-hole-row="${i}"]`);
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // --- Reset round ---
  document.getElementById('reset').addEventListener('click', async () => {
    const ok = await confirmDialog('Reset round? All scores will be cleared.', { okText: 'Reset', destructive: true });
    if (!ok) return;
    round = newRound(currentId);
    saveRound();
    markRoundDirty();
    render();
  });

  // --- History ---
  const loadHistory = () => {
    let h;
    try { h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; }
    if (!Array.isArray(h)) return [];
    let backfilled = false;
    for (const r of h) {
      if (r && typeof r === 'object' && !r.id) { r.id = uid(); backfilled = true; }
    }
    if (backfilled) saveHistory(h);
    return h;
  };
  const saveHistory = (h) => {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); return true; } catch(e) { return false; }
  };

  document.getElementById('save').addEventListener('click', async () => {
    const c = currentCourse();
    const played = round.scores.filter(s => s != null);
    if (played.length === 0) { await alertDialog('No scores to save yet.'); return; }
    const total = played.reduce((a,b) => a+b, 0);
    const parTotal = round.scores.reduce((acc, s, i) => s == null ? acc : acc + c.pars[i], 0);
    const entry = {
      id: uid(),
      date: round.date,
      courseId: c.id,
      courseName: c.name,
      holes: c.holes,
      scores: round.scores.slice(),
      pars: c.pars.slice(),
      total,
      toPar: total - parTotal,
      thru: played.length
    };
    const h = loadHistory();
    h.unshift(entry);
    if (!saveHistory(h)) {
      await alertDialog('Could not save — device storage is full. Delete old rounds or export a backup, then try again.', { title: 'Save failed' });
      return;
    }
    markRoundSaved();
    const startNew = await confirmDialog('Round saved. Start a new round?', { okText: 'New round' });
    if (startNew) {
      round = newRound(currentId);
      saveRound();
      markRoundDirty();
      render();
    }
  });

  document.getElementById('newRoundBtn').addEventListener('click', () => {
    if (roundSaved) {
      // Round already saved, start new immediately
      round = newRound(currentId);
      saveRound();
      render();
    } else {
      // Round has unsaved changes, show confirmation dialog
      showConfirmRoundDialog('new');
    }
  });

  const historyViewEl = document.getElementById('historyView');
  const expandedHistory = new Set();

  function scoreCellClass(score, par) {
    if (score == null) return 'empty';
    const d = score - par;
    if (d < 0)  return 'score-under';
    if (d === 1) return 'score-bogey';
    if (d > 1) return 'score-over';
    return '';
  }

  function holeGridHTML(scores, pars, from, to) {
    const headers = [];
    const parRow  = [];
    const scoreRow = [];
    for (let i = from; i < to; i++) {
      headers.push(`<div class="cell header">${i + 1}</div>`);
      parRow.push(`<div class="cell header">${pars[i]}</div>`);
      const s = scores[i];
      const cls = scoreCellClass(s, pars[i]);
      scoreRow.push(`<div class="cell ${cls}">${s == null ? '–' : s}</div>`);
    }
    return `<div class="hole-grid">${headers.join('')}${parRow.join('')}${scoreRow.join('')}</div>`;
  }

  function historyDetailHTML(r) {
    const holes = r.holes || (r.pars ? r.pars.length : r.scores.length);
    const pars = r.pars || Array(holes).fill(4);
    if (holes === 18) {
      const out = splitTotals(r.scores, pars, 0, 9);
      const inn = splitTotals(r.scores, pars, 9, 18);
      return `
        <div class="history-detail">
          <div class="history-detail-section">
            <div class="history-detail-title"><span>Out</span><span>${out.played ? out.score + ' (' + diffStr(out.diff) + ')' : '—'}</span></div>
            ${holeGridHTML(r.scores, pars, 0, 9)}
          </div>
          <div class="history-detail-section">
            <div class="history-detail-title"><span>In</span><span>${inn.played ? inn.score + ' (' + diffStr(inn.diff) + ')' : '—'}</span></div>
            ${holeGridHTML(r.scores, pars, 9, 18)}
          </div>
        </div>`;
    }
    const tot = splitTotals(r.scores, pars, 0, holes);
    return `
      <div class="history-detail">
        <div class="history-detail-section">
          <div class="history-detail-title"><span>Holes</span><span>${tot.played ? tot.score + ' (' + diffStr(tot.diff) + ')' : '—'}</span></div>
          ${holeGridHTML(r.scores, pars, 0, holes)}
        </div>
      </div>`;
  }

  function computeStats(h) {
    const dist = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0, triple: 0 };
    const byCourse = new Map();
    let bestRound = null;
    let totalToPar = 0;
    let countedRounds = 0;

    for (const r of h) {
      if (!Array.isArray(r.scores) || !Array.isArray(r.pars)) continue;
      for (let i = 0; i < r.scores.length; i++) {
        const s = r.scores[i];
        if (s == null) continue;
        const d = s - r.pars[i];
        if (d <= -2) dist.eagle++;
        else if (d === -1) dist.birdie++;
        else if (d === 0) dist.par++;
        else if (d === 1) dist.bogey++;
        else if (d === 2) dist.double++;
        else if (d >= 3) dist.triple++;
      }

      if (typeof r.toPar === 'number' && Number.isFinite(r.toPar)) {
        totalToPar += r.toPar;
        countedRounds++;
        if (!bestRound || r.toPar < bestRound.toPar) bestRound = r;
      }

      const key = r.courseId || (r.courseName + '·' + (r.holes || (r.pars ? r.pars.length : 18)));
      const name = r.courseName || 'Unknown';
      const holes = r.holes || (r.pars ? r.pars.length : 18);
      let g = byCourse.get(key);
      if (!g) { g = { name, holes, count: 0, sumToPar: 0, best: null }; byCourse.set(key, g); }
      g.count++;
      if (typeof r.toPar === 'number') {
        g.sumToPar += r.toPar;
        if (!g.best || r.toPar < g.best.toPar) g.best = r;
      }
    }

    const avgToPar = countedRounds ? totalToPar / countedRounds : 0;
    const courses = Array.from(byCourse.values()).sort((a, b) => b.count - a.count);
    return { dist, bestRound, avgToPar, total: h.length, courses };
  }

  function statsHTML(h) {
    const s = computeStats(h);
    if (s.total === 0) return '';

    const bestDate = s.bestRound ? new Date(s.bestRound.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
    const bestSub = s.bestRound ? `${escapeHtml(s.bestRound.courseName || '')} · ${bestDate}` : '';
    const bestText = s.bestRound
      ? `${s.bestRound.total} <span style="font-size:14px; color:#8e8e93;">${diffStr(s.bestRound.toPar)}</span>`
      : '—';
    const avgText = Number.isFinite(s.avgToPar)
      ? (s.avgToPar === 0 ? 'E' : (s.avgToPar > 0 ? '+' : '') + s.avgToPar.toFixed(1))
      : '—';

    const overall = `
      <div class="stats-block">
        <div class="stats-title">Overall</div>
        <div class="stats-headline">
          <div><div class="v">${s.total}</div><div class="l">Rounds</div></div>
          <div><div class="v">${bestText}</div><div class="l">Best</div><div class="sub">${bestSub}</div></div>
          <div><div class="v">${avgText}</div><div class="l">Avg to par</div></div>
        </div>
      </div>`;

    const dist = `
      <div class="stats-block">
        <div class="stats-title">Scoring</div>
        <div class="stats-dist">
          <div class="pill under"><span class="count">${s.dist.eagle}</span><span class="lbl">Eagle+</span></div>
          <div class="pill under"><span class="count">${s.dist.birdie}</span><span class="lbl">Birdie</span></div>
          <div class="pill"><span class="count">${s.dist.par}</span><span class="lbl">Par</span></div>
          <div class="pill bogey"><span class="count">${s.dist.bogey}</span><span class="lbl">Bogey</span></div>
          <div class="pill over"><span class="count">${s.dist.double}</span><span class="lbl">Double</span></div>
          <div class="pill over"><span class="count">${s.dist.triple}</span><span class="lbl">Triple+</span></div>
        </div>
      </div>`;

    const courses = s.courses.length > 1 ? `
      <div class="stats-block">
        <div class="stats-title">By course</div>
        <div class="stats-courses">
          ${s.courses.map(g => {
            const avg = g.count ? g.sumToPar / g.count : 0;
            const avgStr = g.count ? (avg === 0 ? 'E' : (avg > 0 ? '+' : '') + avg.toFixed(1)) : '—';
            const bestStr = g.best ? `${g.best.total} ${diffStr(g.best.toPar)}` : '—';
            return `
              <div class="stats-course">
                <div>
                  <div class="name">${escapeHtml(g.name)}</div>
                  <div class="meta">${g.holes} holes · ${g.count} round${g.count === 1 ? '' : 's'} · avg ${avgStr}</div>
                </div>
                <div class="best">${bestStr}</div>
              </div>`;
          }).join('')}
        </div>
      </div>` : '';

    return overall + dist + courses;
  }

  function renderHistory() {
    const h = loadHistory();
    if (h.length === 0) {
      historyViewEl.innerHTML = '<div style="text-align:center; color:#8e8e93; font-size:14px; padding:16px;">No saved rounds yet.</div>';
      return;
    }
    const stats = statsHTML(h);
    historyViewEl.innerHTML = stats + h.map((r) => {
      const dd = new Date(r.date);
      const label = dd.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const toParStr = diffStr(r.toPar);
      const toParCls = r.toPar > 0 ? 'over' : (r.toPar < 0 ? 'under' : 'par');
      const courseLabel = r.courseName ? `${escapeHtml(r.courseName)} · ${r.holes || (r.pars ? r.pars.length : 18)}` : '';
      const expanded = expandedHistory.has(r.id);
      return `
        <div class="hole history-row" data-id="${r.id}" style="grid-template-columns: 1fr auto auto;">
          <div>
            <div class="hole-num" style="font-size:14px;">${label}</div>
            <div class="hole-par">${courseLabel ? courseLabel + ' · ' : ''}thru ${r.thru}</div>
          </div>
          <div style="font-size:20px; font-weight:600;">${r.total}</div>
          <div class="label ${toParCls}" style="min-width:36px;">${toParStr}</div>
          ${expanded ? historyDetailHTML(r) : ''}
          ${expanded ? `<button class="btn danger" data-del="${r.id}" style="grid-column: 1 / -1; height:32px; font-size:12px; margin-top:6px;">Delete round</button>` : ''}
        </div>
      `;
    }).join('');

    historyViewEl.querySelectorAll('.history-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('button[data-del]')) return;
        const id = row.dataset.id;
        if (expandedHistory.has(id)) expandedHistory.delete(id);
        else expandedHistory.add(id);
        renderHistory();
      });
    });

    historyViewEl.querySelectorAll('button[data-del]').forEach(b => {
      b.addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = await confirmDialog('Delete this round?', { okText: 'Delete', destructive: true });
        if (!ok) return;
        const id = b.dataset.del;
        const hh = loadHistory();
        const i = hh.findIndex(r => r.id === id);
        if (i >= 0) hh.splice(i, 1);
        saveHistory(hh);
        expandedHistory.delete(id);
        renderHistory();
      });
    });
  }

  const historyBtn = document.getElementById('history');
  historyBtn.addEventListener('click', () => {
    if (historyViewEl.style.display === 'block') {
      historyViewEl.style.display = 'none';
      historyBtn.classList.remove('active');
      historyBtn.textContent = 'History';
      return;
    }
    renderHistory();
    historyViewEl.style.display = 'block';
    historyBtn.classList.add('active');
    historyBtn.textContent = 'Hide history';
  });

  // --- Backup: export / import ---
  const BACKUP_VERSION = 1;
  const BACKUP_APP = 'golf-scorecard';

  function buildBackup() {
    return {
      app: BACKUP_APP,
      version: BACKUP_VERSION,
      exportedAt: new Date().toISOString(),
      courses: JSON.parse(localStorage.getItem(COURSES_KEY) || 'null'),
      round:   JSON.parse(localStorage.getItem(ROUND_KEY) || 'null'),
      history: JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]')
    };
  }

  function downloadBackup() {
    const data = buildBackup();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = isoLocal(Date.now());
    a.href = url;
    a.download = `golf-scorecard-backup-${today}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  function isValidBackup(obj) {
    if (!obj || typeof obj !== 'object') return false;
    if (obj.app !== BACKUP_APP) return false;
    if (!obj.courses || !Array.isArray(obj.courses.courses)) return false;
    if (!Array.isArray(obj.history)) return false;
    return true;
  }

  async function importBackupFromFile(file) {
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (e) {
      await alertDialog('Could not read that file — it is not valid JSON.');
      return;
    }
    if (!isValidBackup(parsed)) {
      await alertDialog('That file does not look like a Golf Scorecard backup.');
      return;
    }
    const historyCount = parsed.history.length;
    const courseCount = parsed.courses.courses.length;
    const ok = await confirmDialog(
      `Replace all current data with backup from ${new Date(parsed.exportedAt || Date.now()).toLocaleDateString()}? This will overwrite ${courses.length} course(s) and ${loadHistory().length} saved round(s) with ${courseCount} course(s) and ${historyCount} saved round(s).`,
      { title: 'Restore backup', okText: 'Replace', destructive: true }
    );
    if (!ok) return;

    localStorage.setItem(COURSES_KEY, JSON.stringify(parsed.courses));
    if (parsed.round) localStorage.setItem(ROUND_KEY, JSON.stringify(parsed.round));
    else localStorage.removeItem(ROUND_KEY);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(parsed.history));
    location.reload();
  }

  document.getElementById('exportBackup').addEventListener('click', downloadBackup);

  const importFileEl = document.getElementById('importFile');
  document.getElementById('importBackup').addEventListener('click', () => importFileEl.click());
  importFileEl.addEventListener('change', async () => {
    const f = importFileEl.files && importFileEl.files[0];
    importFileEl.value = '';
    if (f) await importBackupFromFile(f);
  });

  // --- Persistent storage ---
  const storageStatusEl = document.getElementById('storageStatus');
  async function refreshStorageStatus() {
    if (!navigator.storage || !navigator.storage.persisted) {
      storageStatusEl.innerHTML = '<span class="dot warn"></span>Persistent storage not supported in this browser.';
      return;
    }
    const persisted = await navigator.storage.persisted();
    if (persisted) {
      storageStatusEl.innerHTML = '<span class="dot ok"></span>Storage is persistent — data survives storage pressure.';
    } else {
      storageStatusEl.innerHTML = '<span class="dot warn"></span>Storage may be evicted under pressure. Add to home screen to improve durability.';
    }
  }
  async function requestPersistOnce() {
    if (!navigator.storage || !navigator.storage.persist) return;
    try {
      const already = await navigator.storage.persisted();
      if (!already) await navigator.storage.persist();
    } catch (e) {}
    refreshStorageStatus();
  }
  requestPersistOnce();

  render();

  // Keep the screen awake while the app is open (auto-released when tab hides).
  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });
  requestWakeLock();

  // Service worker for offline support
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
